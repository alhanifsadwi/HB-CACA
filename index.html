<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Press the Envelope</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>
:root{--cream:#F7E7CE;--gold:#E0A45C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;background:#5B0000;color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif}
body{background:radial-gradient(ellipse at 50% 45%,#B00000 0%,#990000 25%,#760000 55%,#5B0000 100%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(0,0,0,.65)}
.s{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s ease,transform 1.2s ease;transform:scale(1.04);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.s.on{opacity:1;pointer-events:auto;transform:none}
h1,h2{font-family:'Great Vibes',cursive;font-weight:400;margin:0;text-shadow:0 0 18px rgba(255,200,120,.6)}
h1{font-size:clamp(38px,9vw,96px)}h2{font-size:clamp(30px,6vw,64px)}
.hint{font-size:clamp(14px,4vw,20px);font-style:italic;margin-top:14px}
#dust{position:fixed;inset:0;pointer-events:none;z-index:0}
.glow{position:absolute;width:60vmin;height:60vmin;border-radius:50%;background:radial-gradient(#ff9a3c88,transparent 70%);transition:transform 1.2s,opacity 1.2s}
/* envelope */
#env{position:relative;width:min(74vw,380px);aspect-ratio:1.5;cursor:pointer;animation:fl 4s ease-in-out infinite;transition:transform .5s;filter:drop-shadow(0 24px 24px #0008)}
@keyframes fl{50%{transform:translateY(-12px)}}
#env .b{position:absolute;inset:0;background:linear-gradient(135deg,#fbefd9,#ead2ab);border-radius:6px}
#env .f{position:absolute;inset:0;background:linear-gradient(#f3dfbf,#e6c99b);clip-path:polygon(0 0,50% 58%,100% 0);transform-origin:top;transition:transform 1s .3s;border-radius:6px;z-index:2}
#env .l{position:absolute;inset:0;background:linear-gradient(90deg,#e8cfa5 0 0);clip-path:polygon(0 100%,50% 45%,100% 100%);opacity:.5}
#env .w{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;margin:-11% 0 0 -11%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d33,#7a0000);box-shadow:0 4px 8px #0008;z-index:3;transition:transform .5s,opacity .6s;display:grid;place-items:center;color:#f7c9a0;font-size:26px}
#env.open{animation:none;transform:scale(1.15)}
#env.open .f{transform:rotateX(180deg);z-index:0}
#env.open .w{transform:scale(1.5);opacity:0}
/* scrapbook */
.card{background:#F7E7CE;color:#5B0000;padding:clamp(18px,5vw,28px) clamp(20px,6vw,36px);text-align:center;box-shadow:0 14px 30px #0009;background-image:repeating-linear-gradient(0deg,#0000 0 3px,#0000000a 3px 4px);position:relative;z-index:2}
.pol{background:#fff;padding:8px 8px 26px;box-shadow:0 8px 18px #0008;color:#5B0000;font-family:'Great Vibes';font-size:clamp(12px,3vw,16px);text-align:center;position:absolute;transition:transform .4s}
.pol:hover{transform:scale(1.08) rotate(0)!important;z-index:9}
.pol i{display:block;width:100%;height:calc(100% - 4px);background:linear-gradient(135deg,#e7b7b7,#c98)center/cover}
.dec{position:absolute;font-size:clamp(22px,5vw,54px);filter:drop-shadow(0 4px 4px #0006);animation:fl 5s ease-in-out infinite}
.btn{font-family:'Poppins',sans-serif;font-size:clamp(11px,3vw,13px);letter-spacing:.2em;color:var(--cream);background:none;border:1px solid var(--gold);padding:12px 22px;border-radius:30px;cursor:pointer;animation:pu 2s infinite;z-index:3;white-space:nowrap}
@keyframes pu{50%{box-shadow:0 0 22px var(--gold);transform:scale(1.05)}}
.back{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:#2e7d32;color:#fff;border:0;border-radius:20px;padding:9px 18px;font:500 clamp(11px,3vw,13px) Poppins;cursor:pointer;z-index:20}
/* menu */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,3vw,40px);margin-top:24px;width:100%;max-width:640px}
@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}}
.o{cursor:pointer;text-align:center;transition:transform .3s,filter .3s;filter:drop-shadow(0 0 10px #ffb05a55);animation:fl 5s ease-in-out infinite;min-width:0}
.o:nth-child(2){animation-delay:-1s;rotate:3deg}.o:nth-child(3){animation-delay:-2s;rotate:-3deg}.o:nth-child(1){rotate:-2deg}
.o:hover{transform:scale(1.14);filter:drop-shadow(0 0 26px #ffb05a)}
.o b{display:block;font-size:clamp(46px,11vw,120px);font-weight:400;line-height:1}
.o span{font-family:'Great Vibes';font-size:clamp(18px,5vw,34px);opacity:.8}.o:hover span{opacity:1}
/* gallery */
.wall{position:relative;width:min(96vw,900px,calc(78dvh*1.45));aspect-ratio:900/620}
.fr{position:absolute;border:10px solid;border-image:linear-gradient(135deg,#f6d37a,#8a5a1a,#f6d37a) 1;background:#3b0000;box-shadow:0 10px 22px #000a,0 0 24px #e0a45c55;overflow:hidden}
.fr i{display:block;width:100%;height:100%;background:linear-gradient(135deg,#e7b7b7,#c98)center/cover}
.letter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46%;z-index:50;padding:18px 22px;font-family:'Great Vibes';font-size:clamp(13px,2.1vw,21px);line-height:1.35;white-space:pre-line;text-align:left;max-height:90%;overflow:auto}
.fr b{position:absolute;left:0;right:0;bottom:0;background:#F7E7CEe6;color:#5B0000;font:400 clamp(13px,2.4vw,20px) 'Great Vibes';text-align:center;padding:2px 4px}
.letter h2{font-size:clamp(24px,5vw,46px)}
#s4{justify-content:flex-start;padding-top:60px}
#s7{justify-content:flex-start;padding-top:60px}
#s7 #gbox{margin-top:auto}#s7 #gh{margin-bottom:auto}#s7 .card{margin:auto;max-width:90vw}
#w4{width:min(96vw,900px);aspect-ratio:auto;margin:auto}
#w4 .letter{position:relative;left:auto;top:auto;transform:none;margin:0 auto}

.letter h2{color:#760000;text-shadow:none;text-align:center}
#gbox{font-size:clamp(90px,30vw,220px);cursor:pointer;transition:transform .3s;filter:drop-shadow(0 0 30px #ffb05a88)}
#gbox.shake{animation:sh .5s 2}
@keyframes sh{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.heart{position:fixed;font-size:24px;pointer-events:none;z-index:30;animation:fy 2.4s ease-out forwards}
@keyframes fy{to{transform:translate(var(--x),var(--y)) scale(1.6);opacity:0}}
iframe,video{width:min(92vw,720px);aspect-ratio:16/9;border:8px solid #E0A45C;border-radius:6px;background:#000;box-shadow:0 0 40px #ffb05a66;max-width:100%}
@media(max-width:640px){
#w5{width:100%;aspect-ratio:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:0 6px}
#w5 .fr{position:relative!important;left:auto!important;top:auto!important;width:100%!important;height:auto!important;aspect-ratio:4/5;transform:none!important}
#w4{width:97vw}
#w4 .pol{width:26%!important}
#w4 .letter{width:64%;padding:10px;font-size:12.5px;line-height:1.3}
#w4 .letter h2{font-size:24px}
}
@media(max-width:380px){
.grid{gap:8px}
.o b{font-size:11vw}
.card{padding:16px 14px}
#w4 .pol{width:28%!important}
#w4 .letter{width:66%;padding:8px;font-size:11px}
}
@media(max-height:560px) and (orientation:landscape){
#env{width:min(46vw,260px)}
h1{font-size:clamp(28px,7vw,60px)}
.grid{margin-top:12px}
.o b{font-size:clamp(34px,8vw,70px)}
#gbox{font-size:clamp(60px,20vw,140px)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body>
<canvas id="dust"></canvas>

<section class="s on" id="s1"><div class="glow"></div>
<h1>Press the Envelope</h1>
<div id="env" role="button" aria-label="Buka amplop"><div class="b"></div><div class="l"></div><div class="f"></div><div class="w">♥</div></div>
<div class="hint">tap to begin!</div></section>

<section class="s" id="s2"><div id="scrap" style="position:relative;width:min(96vw,760px);height:min(80dvh,560px)"></div>
<button class="btn" onclick="go('s3')">TAP FOR SURPRISE</button></section>

<section class="s" id="s3"><h2>Choose the Surprise</h2>
<div class="grid">
<div class="o" onclick="go('s4')"><b>📷</b><span>Journey</span></div>
<div class="o" onclick="go('s5')"><b>🕰️</b><span>Moment</span></div>
<div class="o" onclick="go('s6')"><b>💿</b><span>Music</span></div>
<div class="o" onclick="go('s7')"><b>🎁</b><span>Gift</span></div></div></section>

<section class="s" id="s4"><button class="back" onclick="go('s3')">BACK</button><div class="wall" id="w4"><div class="card letter" id="let"></div></div></section>
<section class="s" id="s5"><button class="back" onclick="go('s3')">BACK</button><div class="wall" id="w5"></div></section>
<section class="s" id="s6"><button class="back" onclick="go('s3')">BACK</button><h2>Music</h2><div id="vid" style="margin-top:14px"></div>
<div class="hint">🎵 ♪ 📻 📺 💿 — tekan play untuk memulai</div></section>
<section class="s" id="s7"><button class="back" onclick="go('s3')">BACK</button>
<div id="gbox" onclick="openGift()">🎁</div><div class="hint" id="gh">tap the gift</div>
<div class="card" id="gmsg" style="display:none;max-width:520px"></div></section>

<script>
/* ===== CONFIG — edit here ===== */
const C={
 recipientName:"Salsabila Niza Ramadhani Azzahra", senderName:"Gopang", birthdayDate:"28 September 2006",
 mainTitle:"Happy Birthday",

 // Foto khusus Scrapbook (cover pertama setelah amplop dibuka) — 6 slot
 scrapPhotos:["fts_1.jpeg","fts_4.jpeg","fts_3.jpeg","fts_2.jpeg","fts_5.jpeg","fts_6.jpeg"],

 // Foto khusus Journey (polaroid di kiri-kanan surat) — bebas jumlahnya, akan berulang mengisi 6 slot
 journeyPhotos:["ftss_1.jpeg","ftss_2.jpeg","ftss_3.jpeg","ftss_4.jpeg","ftss_5.jpeg","ftss_6.jpeg"],

 // Foto khusus Moment (6 frame klasik berjajar) — idealnya persis 6 foto
 momentPhotos:["ft_1.jpeg","ft_2.jpeg","ft_3.jpeg","ft_4.jpeg","ft_5.jpeg","ft_6.jpeg"],

 giftPhoto:"ftd.jpeg", // foto tengah di Gift

 momentCaptions:["first day","tawa bareng","our trip","random day","favorite","always"], // caption pendek tiap frame Moment
 photoCaptions:["us","first trip","always","sunset","cheers","home"], // caption tiap polaroid Journey

 videoURL:"f_u.mp4", // YouTube embed URL (https://www.youtube.com/embed/ID) or a .mp4 file
 backgroundMusic:"TULUS.mp3", // e.g. "lagu.mp3" (plays after first tap)
 letterMessage:`Hari ini adalah hari yang sangat spesial,
karena hari ini kamu hadir ke dunia.

Terima kasih sudah menjadi bagian dari
banyak cerita, tawa, dan kenangan indah.

Semoga di usia yang baru ini,
semua hal baik datang kepadamu,
dan semua impianmu perlahan menjadi kenyataan.

You are special.
You are loved.
And you deserve all the beautiful things in this world.

Happy Birthday ♡`,
 giftMessage:"Semoga semua harimu hangat dan penuh cinta."
};
/* ================================ */
const $=id=>document.getElementById(id);
// ph(arr,i) ambil foto ke-i dari array tertentu (arr diteruskan eksplisit, tidak lagi selalu dari C.photos)
const ph=(arr,i)=>arr&&arr.length?`background-image:url('${arr[i%arr.length]}')`:'';
const cap=i=>C.photoCaptions[i%C.photoCaptions.length]||'';
function pols(el,n,arr){el.querySelectorAll('.pol').forEach(p=>p.remove());for(let i=0;i<n;i++){const d=document.createElement('div');d.className='pol';const side=i%2?'right':'left';
d.style.cssText=`width:19%;aspect-ratio:1/1.2;${i<3?'left':'right'}:${1+(i%2)*1.5}%;top:${(i%3)*33.5}%;transform:rotate(${(i%2?1:-1)*(2+i)}deg);opacity:0;z-index:${i}`;
d.innerHTML=`<i style="${ph(arr,i)}"></i>${cap(i)}`;el.appendChild(d);setTimeout(()=>{d.style.opacity=1;d.style.transition='opacity .6s,transform .6s'},300+i*220)}}
function decor(el,a){a.forEach(([e,x,y])=>{const d=document.createElement('div');d.className='dec';d.textContent=e;d.style.cssText=`left:${x}%;top:${y}%;z-index:5`;el.appendChild(d)})}
// scrapbook — pakai C.scrapPhotos
(function(){const s=$('scrap');
s.innerHTML=`<div class="card" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-55%) rotate(-1deg);width:min(62%,340px)"><h2 style="color:#760000;text-shadow:none">${C.mainTitle}</h2><div style="font-size:22px">${C.birthdayDate}</div></div>`;
[[0,3,4,-7],[1,6,35,5],[2,3,66,-4]].forEach(([i,x,y,r])=>{const d=document.createElement('div');d.className='pol';d.style.cssText=`width:24%;height:30%;left:${x}%;top:${y}%;transform:rotate(${r}deg)`;d.innerHTML=`<i style="${ph(C.scrapPhotos,i)}"></i>`;s.appendChild(d)});
[3,4,5].forEach((i,k)=>{const d=document.createElement('div');d.className='pol';d.style.cssText=`width:24%;height:30%;right:3%;top:${4+k*31}%;transform:rotate(${k%2?5:-4}deg)`;d.innerHTML=`<i style="${ph(C.scrapPhotos,i)}"></i>`;s.appendChild(d)});
decor(s,[['🌹',30,72],['🌸',58,74],['🌿',72,66],['💗',46,4],['🌹',6,86]])})();
// frames — Moment, pakai C.momentPhotos
function frames(){const w=$('w5');w.innerHTML='';const pos=[[4,6,26,44],[34,2,30,32],[68,8,26,40],[8,56,30,38],[42,44,22,46],[68,56,28,38]];
pos.forEach((p,i)=>{const d=document.createElement('div');d.className='fr';d.style.cssText=`left:${p[0]}%;top:${p[1]}%;width:${p[2]}%;height:${p[3]}%;transform:rotate(${(i%3-1)*2}deg);opacity:0;transition:opacity .7s`;d.innerHTML=`<i style="${ph(C.momentPhotos,i)}"></i><b>${C.momentCaptions[i]||''}</b>`;w.appendChild(d);setTimeout(()=>d.style.opacity=1,300+i*200)})}
// letter
$('let').innerHTML=`<h2>Happy ${C.recipientName}</h2>${C.letterMessage}\n\n— ${C.senderName}`;
// video
(function(){const v=C.videoURL;$('vid').innerHTML=!v?`<div style="width:min(92vw,720px);aspect-ratio:16/9;display:grid;place-items:center;border:8px solid #E0A45C;background:#200;text-align:center;padding:20px">Isi <b>videoURL</b> di bagian CONFIG</div>`:/\.(mp4|webm)$/i.test(v)?`<video src="${v}" controls preload="none"></video>`:`<iframe src="${v}" allowfullscreen></iframe>`})();
// nav
let cur='s1',aud;
function go(id){if(cur==='s6'){const e=$('vid').firstElementChild;if(e.tagName==='VIDEO')e.pause();else if(e.tagName==='IFRAME')e.src=e.src}
 $(cur).classList.remove('on');$(id).classList.add('on');cur=id;
 if(aud){id==='s6'?aud.pause():aud.play().catch(()=>{})}
 if(id==='s4')pols($('w4'),6,C.journeyPhotos);if(id==='s5')frames();
 if(id!=='s7'){$('gmsg').style.display='none';$('gbox').style.display='';$('gh').style.display=''}}
function burst(n){for(let i=0;i<n;i++){const h=document.createElement('div');h.className='heart';h.textContent=['♥','✦','❀'][i%3];h.style.cssText=`left:50%;top:50%;color:#ffb3c1;--x:${(Math.random()-.5)*90}vw;--y:${(Math.random()-.8)*70}vh`;document.body.appendChild(h);setTimeout(()=>h.remove(),2500)}}
function openGift(){const b=$('gbox');b.classList.add('shake');setTimeout(()=>{b.textContent='✨';burst(30);setTimeout(()=>{b.style.display='none';$('gh').style.display='none';const m=$('gmsg');m.style.display='block';m.innerHTML=`<div class="fr" style="position:relative;width:min(50vw,210px);aspect-ratio:4/5;margin:0 auto 16px"><i style="${C.giftPhoto?`background-image:url('${C.giftPhoto}')`:''}"></i></div><h2 style="color:#760000;text-shadow:none">Happy Birthday, ${C.recipientName} ♡</h2><p style="font-size:24px">${C.giftMessage}</p><p>— ${C.senderName}</p>`;b.textContent='🎁';b.classList.remove('shake')},900)},1000)}
// envelope
$('env').onclick=function(){if(this.classList.contains('open'))return;this.classList.add('open');
 if(C.backgroundMusic){aud=new Audio(C.backgroundMusic);aud.loop=true;aud.volume=.6;aud.play().catch(()=>{})}
 document.querySelector('.glow').style.transform='scale(2.2)';burst(16);setTimeout(()=>go('s2'),1400)};
// dust
(function(){const c=$('dust'),x=c.getContext('2d');let P=[];function r(){c.width=innerWidth;c.height=innerHeight;P=Array.from({length:50},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.8+.4,v:Math.random()*.3+.1}))}
r();onresize=r;(function f(){x.clearRect(0,0,c.width,c.height);x.fillStyle='rgba(247,231,206,.45)';P.forEach(p=>{p.y-=p.v;if(p.y<0)p.y=c.height;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)})()})();
</script></body></html>
